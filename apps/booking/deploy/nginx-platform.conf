# Digital Court 平台（多場館）的 nginx 設定：/etc/nginx/sites-available/booking
#   https://dc-studio.cc/                 品牌首頁與平台頁（/opt/booking/landing）
#   https://dc-studio.cc/platform/…       平台 API（註冊、訂閱、webhook）→ 程式，不帶 X-Tenant
#   https://dc-studio.cc/<場館代碼>/…      場館 → 程式，去掉前綴並帶 X-Tenant: <場館代碼>
# 自訂網域的 server 區塊由 booking-domains（見 domains.sh）另外產生在 /etc/nginx/sites-available/booking-domains
# install.sh 更新時看到 "server_name dc-studio.cc;" 與 listen 443 會保留這份設定
upstream booking_app { server 127.0.0.1:8100; }

server {
    listen 443 ssl;
    server_name dc-studio.cc;
    ssl_certificate /etc/letsencrypt/live/dc-studio.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dc-studio.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10M;
    charset utf-8;
    charset_types text/plain text/xml application/xml text/css application/javascript;

    # 品牌首頁、平台頁與靜態檔
    location = / { root /opt/booking/landing; try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location ~ ^/(robots\.txt|sitemap\.xml|sitemap-main\.xml|llms\.txt|favicon\.svg|favicon-48\.png|apple-touch-icon\.png|logo-512\.png|og\.png|mock-cover\.webp|site\.css|platform\.js)$ {
        root /opt/booking/landing; add_header Cache-Control "public, max-age=3600";
    }
    location = /favicon.ico { root /opt/booking/landing; try_files /favicon-48.png =404; }
    location ~ ^/signup/done/?$ { root /opt/booking/landing; try_files /done.html =404; add_header Cache-Control "no-cache"; }
    location ~ ^/(signup|account|console|terms|privacy|report)/?$ { root /opt/booking/landing; try_files /$1.html =404; add_header Cache-Control "no-cache"; }

    # 平台 API 與 LINE 共用登入：不帶場館
    location ^~ /platform/ {
        proxy_pass http://booking_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /auth/ {
        proxy_pass http://booking_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 場館：/<代碼>/… → 程式（去掉前綴，帶 X-Tenant）
    location ~ ^/([a-z0-9][a-z0-9-]{1,28}[a-z0-9])$ { return 301 /$1/$is_args$args; }
    location ~ ^/(?<tenant>[a-z0-9][a-z0-9-]{1,28}[a-z0-9])/(?<rest>.*)$ {
        proxy_pass http://booking_app/$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant $tenant;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 其他路徑（例如最早的 /e/<代碼>）接到示範場館
    location / { return 302 /active$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.dc-studio.cc;
    ssl_certificate /etc/letsencrypt/live/dc-studio.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dc-studio.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://dc-studio.cc$request_uri;
}

# 舊網址：全部永久轉到新網址（已分享的活動連結不會斷）
server {
    listen 443 ssl;
    server_name active.dc-studio.cc;
    ssl_certificate /etc/letsencrypt/live/dc-studio.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dc-studio.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://dc-studio.cc/active$request_uri;
}
server {
    listen 443 ssl;
    server_name 172-237-11-215.sslip.io;
    ssl_certificate /etc/letsencrypt/live/172-237-11-215.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/172-237-11-215.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://dc-studio.cc/active$request_uri;
}

server {
    listen 80;
    server_name dc-studio.cc www.dc-studio.cc active.dc-studio.cc 172-237-11-215.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
